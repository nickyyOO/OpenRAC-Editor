# editor-runtime's tests (mods/editor-runtime/tests): the JSON reader, the cutscene timeline and the
# behaviour presets, with the address and undefined-behaviour sanitizers. No mod SDK and no game.
name: editor-runtime

on:
  pull_request:
    paths: ["mods/editor-runtime/**", ".github/workflows/editor-runtime.yml"]
  push:
    branches: [main, master]
    paths: ["mods/editor-runtime/**", ".github/workflows/editor-runtime.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build
        run: cmake -S mods/editor-runtime/tests -B build/tests && cmake --build build/tests
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure
