# Test builds of OpenRAC Editor, kept as run artifacts for 14 days: nothing is published and the
# launcher never sees them. Run it by hand from the Actions tab on any branch and tick the systems
# to build; a push to a ci/test-build* branch builds all three. Linux and Windows give the release
# archive (build/package.py); macOS gives a .dmg to drag the app onto Applications, with the
# editor's tools and project files inside the app.
name: test-build

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux (x86_64 .zip)
        type: boolean
        default: true
      windows:
        description: Windows (x86_64 .zip)
        type: boolean
        default: true
      macos:
        description: macOS (Apple Silicon .dmg)
        type: boolean
        default: true
  push:
    branches: ["ci/test-build*"]

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          LINUX: ${{ github.event_name == 'push' || inputs.linux }}
          WINDOWS: ${{ github.event_name == 'push' || inputs.windows }}
          MACOS: ${{ github.event_name == 'push' || inputs.macos }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all = [
              {"system": "linux", "runner": "ubuntu-24.04", "scons": "platform=linuxbsd wayland=no",
               "program": "bin/godot.linuxbsd.editor.x86_64", "asset": "openrac-editor-linux-x86_64.zip"},
              {"system": "windows", "runner": "windows-2025", "scons": "platform=windows",
               "program": "bin/godot.windows.editor.x86_64.exe", "asset": "openrac-editor-windows-x86_64.zip"},
              {"system": "macos", "runner": "macos-15", "scons": "platform=macos arch=arm64 metal=yes vulkan=no",
               "program": "bin/godot.macos.editor.arm64", "asset": "openrac-editor-macos-arm64.zip"},
          ]
          picked = [s for s in all if os.environ[s["system"].upper()] == "true"]
          if not picked:
              raise SystemExit("Tick at least one system.")
          print("matrix=" + json.dumps({"include": picked}))
          PY

  build:
    needs: pick
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build tools
        shell: bash
        run: |
          python -m pip install -q scons
          if [ "${{ matrix.system }}" = linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          fi

      - name: Build the editor
        shell: bash
        run: scons ${{ matrix.scons }} profile=build/custom.py -j"$(python -c 'import os; print(os.cpu_count())')"

      - name: Pack it
        shell: bash
        run: |
          VERSION="test-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python build/package.py "${{ matrix.program }}" "${{ matrix.system }}" "$VERSION" "${{ matrix.asset }}"

      - name: Check it
        shell: bash
        run: python build/smoke.py "${{ matrix.asset }}" "$VERSION"

      # The .dmg as Mac apps ship: the app and a link to Applications to drag it onto. The editor's
      # tools, project files and guides from the archive go inside the app (Contents/Resources);
      # the launcher still installs the .zip. Unsigned apart from an ad-hoc signature: on first
      # start, right-click the app and choose Open.
      - name: Make the .dmg
        if: matrix.system == 'macos'
        run: |
          ditto -x -k "${{ matrix.asset }}" unpacked
          APP="unpacked/OpenRAC Editor.app"
          for extra in unpacked/*; do
            [ "$extra" = "$APP" ] || mv "$extra" "$APP/Contents/Resources/"
          done
          codesign --force --deep --sign - "$APP"
          mkdir dmg
          mv "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "OpenRAC Editor" -srcfolder dmg -ov -format UDZO \
            "OpenRAC-Editor-$VERSION-macos-arm64.dmg"
          echo "OUT=OpenRAC-Editor-$VERSION-macos-arm64.dmg" >> "$GITHUB_ENV"

      - name: Name the artifact
        if: matrix.system != 'macos'
        shell: bash
        run: echo "OUT=${{ matrix.asset }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
